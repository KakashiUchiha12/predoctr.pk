<!-- JavaScript (Add to your footer.php before </body> or use wp_enqueue_script) -->
<script>
(function() {
    const banner = document.getElementById('predoctr-sponsored-banner');
    const body = document.body;

    function hasBannerBeenDismissed() {
        return localStorage.getItem('predoctr-banner-dismissed') === 'true';
    }

    function showPreDoctrBanner() {
        if (hasBannerBeenDismissed()) return;
        banner.style.display = 'block';
        banner.classList.add('predoctr-banner-show');
        body.classList.add('predoctr-banner-active');
    }

    window.closePreDoctrBanner = function() {
        localStorage.setItem('predoctr-banner-dismissed', 'true');
        banner.classList.add('predoctr-banner-hide');
        body.classList.remove('predoctr-banner-active');
        setTimeout(() => {
            banner.style.display = 'none';
            banner.classList.remove('predoctr-banner-show', 'predoctr-banner-hide');
        }, 300);
    };

    // Show banner after page load
    window.addEventListener('load', function() {
        setTimeout(showPreDoctrBanner, 1000);
    });

    // ESC key to close
    document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape' && banner.style.display === 'block') {
            window.closePreDoctrBanner();
        }
    });
})();
</script>
