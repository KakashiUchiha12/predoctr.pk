<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>preDoctr.pk</title>
  <script>
    // GitHub Pages SPA redirect trick
    // Encodes the current path/query into the index.html URL as a query param
    // so the React app can decode it and handle the route correctly.
    var l = window.location;
    l.replace(
      l.protocol + '//' + l.host + l.pathname.split('/').slice(0, 1).join('/') +
      '/?p=' + encodeURIComponent(l.pathname + l.search) + l.hash
    );
  </script>
</head>
<body></body>
</html>
